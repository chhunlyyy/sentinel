name: sentinel-shared
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch sentinel
        run: git clone --depth 1 --branch "${SENTINEL_REF:-main}" "${SENTINEL_URL}" "$RUNNER_TEMP/sentinel"
        env:
          SENTINEL_URL: ${{ vars.SENTINEL_URL }}
          SENTINEL_REF: ${{ vars.SENTINEL_REF }}
      - name: Shared gate
        run: python3 "$RUNNER_TEMP/sentinel/scripts/shared_ci.py" --dir . --run-command "${{ vars.REGRESSION_COMMAND }}"
