version: 1
shape: fullstack

repos:
  - id: backend
    path: ./backend
    role: backend
    profile: spring-gradle
  - id: frontend
    path: ./frontend
    role: frontend
    profile: nextjs

qa:
  driver: playwright
  db_clone: none
  fixtures: sanitized

rules:
  no_code_comments: false
  no_em_dashes: false
  no_coauthor_trailer: false
  agents_never_run_git: false
  no_permanent_frontend_tests: false

limits:
  review_rounds: 2
  qa_rounds: 3
  release_check_rounds: 3

state:
  dir: .sentinel
  retention: { runs: 20, logs_days: 14 }
  shared_repo: "https://git.example.com/your-team/your-shared-repo.git"
  shared_ref: main
  auto_sync_push: true

tracker:
  kind: none
