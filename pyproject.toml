[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
dynamic = ["version"]
description = "Tiered build pipeline for AI coding agents: triage, spec, code, review, QA and release checks, driven by one config file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4"]
keywords = ["ai", "agents", "pipeline", "code-review", "qa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/chhunlyyy/sentinel"
Issues = "https://github.com/chhunlyyy/sentinel/issues"

[project.scripts]
sentinel = "sentinel.scripts.sentinel:main"

[tool.hatch.version]
path = "sentinel/VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "sentinel/skills"

[tool.hatch.build.targets.sdist]
include = ["sentinel", "skills", "docs", "README.md", "LICENSE", "pyproject.toml"]
