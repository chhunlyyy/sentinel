<rect x="370" y="448" width="270" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
<circle cx="394" cy="470" r="13" fill="#6366f1"/>
<text x="394" y="475" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="416" y="475" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" text-anchor="start" >Tests and specs shared</text>
<rect x="670" y="448" width="270" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
<circle cx="694" cy="470" r="13" fill="#6366f1"/>
<text x="694" y="475" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="716" y="475" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" text-anchor="start" >Logs stay on your machine</text>
